name: eventos_cr
description: ZazzyPop - Eventos cool en Costa Rica
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  go_router: ^14.0.2
  # google_mobile_ads: ^5.1.0       # add back for Android build
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  # flutter_local_notifications: ^17.2.1+2  # add back for Android build
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
